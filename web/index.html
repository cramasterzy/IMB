<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151619" />
    <meta name="description" content="IMB — Infinite Media Board 是支持图片、GIF、视频与文字的免费视觉参考软件，提供无限画布功能。A free PureRef alternative for motion references." />
    <meta name="keywords" content="无限画布,无限画板,参考图软件,PureRef,PureRef alternative,infinite canvas,infinite board,visual reference board,video moodboard,GIF board,IMB" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob:; img-src 'self' data: blob:; script-src 'self';" />
    <title>IMB — Infinite Media Board | Video, GIF &amp; Visual Reference Workspace</title>
    <link rel="canonical" href="https://cramasterzy.github.io/IMB/web/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IMB" />
    <meta property="og:title" content="IMB — Infinite Media Board | Video, GIF &amp; Visual Reference Workspace" />
    <meta property="og:description" content="免费、免安装的无限画布：实时播放视频与 GIF，管理图片、文字和动态视觉参考。" />
    <meta property="og:url" content="https://cramasterzy.github.io/IMB/web/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="imb-icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="sr-only">IMB — Infinite Media Board | Visual Reference Workspace for Video, GIF, Images and Text</h1>
    <nav id="tabbar" aria-label="画板标签页">
      <div class="tab-app-mark" aria-hidden="true"><img src="imb-icon.svg" alt="" /></div>
      <div id="tabs"></div>
      <button id="new-tab" title="新建画板 (Ctrl+T)" aria-label="新建画板">＋</button>
    </nav>
    <main id="viewport" tabindex="0">
      <div id="grid"></div><div id="world"></div><div id="snap-guides"></div>
      <div id="selection-outline">
        <div class="group-resize-handle nw" data-direction="nw"></div><div class="group-resize-handle n" data-direction="n"></div>
        <div class="group-resize-handle ne" data-direction="ne"></div><div class="group-resize-handle e" data-direction="e"></div>
        <div class="group-resize-handle se" data-direction="se"></div><div class="group-resize-handle s" data-direction="s"></div>
        <div class="group-resize-handle sw" data-direction="sw"></div><div class="group-resize-handle w" data-direction="w"></div>
      </div>
      <div id="selection-marquee"></div><div id="drop-hint">松开以添加媒体</div>
    </main>
    <header id="toolbar">
      <div class="toolbar-group">
        <button id="open" title="打开浏览器画板 (Ctrl+O)">打开</button><button id="save" title="保存到当前浏览器 (Ctrl+S)">保存</button>
        <div class="share-control"><button id="share" title="选择分享版本" aria-haspopup="menu" aria-expanded="false">分享</button><div id="share-menu" class="share-menu" role="menu" hidden><button data-share-mode="editable" role="menuitem"><strong>可编辑版本</strong></button><button data-share-mode="readonly" role="menuitem"><strong>只读版本</strong></button></div></div><button id="text" title="创建 MiSans 文本框">文本</button>
      </div>
      <div class="toolbar-group toolbar-right">
        <button id="arrange-all">一键排版</button><button id="arrange-by-type">分类排版</button><button id="restart-all">从头播放</button>
        <button id="play-all">暂停全部</button><button id="resume-all">继续播放</button><button id="mute" aria-pressed="false">静音</button><button id="fit">适应</button>
        <button id="pin" title="网页版不支持窗口置顶">置顶</button><span id="zoom-label">100%</span>
      </div>
    </header>
    <footer id="statusbar"><span id="item-count">0 个项目</span><span id="status-text">浏览器本地自动保存</span><span></span></footer>
    <div id="toast"></div>
    <script src="board-data.js"></script><script src="template-data.js"></script><script src="media-loader.js"></script><script src="fflate.js"></script><script src="web-api.js"></script><script src="app.js"></script><script src="register.js"></script>
  </body>
</html>
